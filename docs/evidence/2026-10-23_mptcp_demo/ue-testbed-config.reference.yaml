# MPX config - client side (mpxd), FALCON testbed: the UE laptop with two Quectel RM500Q modems.
#
# Testbed facts (hardware-docs Dual-UE, SYSTEM.md §10): each modem is a wwanN interface whose name
# and address change between runs; the hardware team's scripts attach it, set its address and the
# policy routing (tables 151 / 152). mpxd changes none of that: links are found by subnet, and the
# address is followed at runtime. Run deploy/testbed/check.sh first.
#
#   sudo ./build/mpxd --config configs/testbed/ue.yaml --dry-run    # which interface each link found
#
# Channels must stay identical to configs/testbed/server.yaml (and to configs/ue.yaml).
uid: falcon-ue-01
role: client

# ---- Links: the two modems, by the subnet of their DNN ----------------------------------
# Path 1 = link-1 = FR1, the backup (server 10.45.0.1); path 2 = link-2 = FR3, the primary (server
# 10.46.0.1) -- fixed for the demo (2026-10-22). Both DUs are FR1 (n78) for now: "FR3" is the role
# link-2 plays. The dashboard numbers the paths in this order and shows the labels.
links:
  - name: link-1
    match:
      subnet: 10.45.0.0/16   # DNN internet -> DU1 (with the right SIM and cell lock)
    label: "FR1"
    du: "1"                  # the server shows DU1's KPM on this link
    data_role: backup        # FR1: carries the data only while link-2 is unusable
  - name: link-2
    match:
      subnet: 10.46.0.0/16   # DNN internet2 -> DU2
    label: "FR3"
    du: "2"
    data_role: primary       # FR3: the data plane uses it while it is usable

# ---- The server (Spark): its two fixed addresses on ogstun, one per link -----------------
servers:
  - uid: falcon-server-01
    data_port: 9001
    control_port: 9002
    paths:
      - link: link-1
        addr: 10.45.0.1
      - link: link-2
        addr: 10.46.0.1

local_api:
  enabled: true
  socket: /tmp/mpx-ue.sock
  max_apps: 8
  max_msg_bytes: 67108864

# ---- Channels: identical (same list, same order) to the server's ----
channels:
  - name: video
    mode: bulk
    max_payload: 67108864
  - name: control
    mode: realtime
    max_payload: 1200
  - name: telemetry
    mode: realtime
    max_payload: 1200
  - name: files
    mode: reliable
  - name: tcp            # the forwarder's channel (the demo's DASH video)
    mode: reliable

use_channels:
  - channel: video
    to: [falcon-server-01]
  - channel: control
    to: [falcon-server-01]
  - channel: telemetry
    to: [falcon-server-01]
  - channel: files
    to: [falcon-server-01]
  - channel: tcp
    to: [falcon-server-01]

session:
  reconnect_backoff_ms: [100, 2000]

mptcp:
  pm: userspace          # mpxd creates exactly link-1 -> 10.45.0.1 and link-2 -> 10.46.0.1
  max_subflows: 8

# ---- Path state. A path is degraded after hb_interval_ms x hb_miss_degrade without receiving
#      anything on it, down after x hb_miss_down. The netns values (2 / 4 = 100 / 200 ms) are far
#      too tight for 5G: a scheduling or HARQ gap over 100 ms would fail the data over to link-1.
#      Starting values below; set them from deploy/testbed/rtt.sh under load (the longest gap
#      between replies), and keep the server's the same.
control:
  scheduler: redundant-all
  redundant_k: 2
  max_payload: 1200
  bind_to_device: false
  dscp: 0xB8
  hb_interval_ms: 50
  hb_miss_degrade: 8               # 400 ms without a packet: degraded (-> failover, see data.failover_on)
  hb_miss_down: 16                 # 800 ms: down
  hb_recover: 3
  state_min_dwell_ms: 200
  probe_interval_ms: 1000
  dedup_window: 1024
  rxq_max_frames: 4096

data:
  scheduler: kernel-managed
  dscp: 0
  send_queue_bytes: 8388608
  overflow_policy: drop-oldest
  resume_buffer_bytes: 67108864    # >= 2 x send_queue_bytes + so_sndbuf + the server's so_rcvbuf
  so_rcvbuf: 16777216
  so_sndbuf: 16777216
  congestion_control: bbr          # empty = the kernel default (mpxd warns if bbr is missing)
  rxq_max_bytes: 16777216
  max_frame_payload: 1048576
  failover_on: degraded            # down: leave link-2 (the primary) only once it is down (fewer, later switches)
  failback_ms: 5000
  outage_grace_ms: 500
  stuck_rto_retrans: 2             # a subflow this many RTOs behind on a path that is up is replaced (C45); 0: off

hints:
  ttl_ms: 2000
  avoid_threshold: 0.3

telemetry:
  enabled: true
  interval_ms: 100
  out_dir: ./out/                  # the launcher (falcon-app-template/demo/ue.sh) points it at its run dir

log:
  level: info
