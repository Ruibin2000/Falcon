# TCP forwarder, server side (Spark / netns mpxcloud): python3 -m forwarder --config configs/forward_server.yaml
#
# The browser on this host opens http://127.0.0.1:8080/ ; the forwarder carries each TCP
# connection over mpxd's `tcp` channel to the UE, whose forwarder connects to the UE's local
# HTTP server (configs/forward_ue.yaml). See docs/05-forwarder.md.
mpxd_socket: /tmp/mpx-server.sock
channel: tcp                 # a reliable channel in both mpxd configs
app_name: forwarder
window_kb: 4096              # per-connection flow-control window: caps a connection at window / RTT
                             # (4 MiB at 400 ms loaded RTT = ~80 Mbit/s)
hello_interval_s: 2          # HELLO to the peer's forwarder this often (it tells it we're up)
peer_timeout_s: 10           # nothing from the peer for this long while a path to it is up: its connections are reset
                             # (a cut shorter than this leaves them open: the player rides it out)
outage_timeout_s: 120        # every path to the peer DOWN for this long: its connections are reset
                             # (shorter: mpxd holds the data and resumes; nothing arrives meanwhile, A26)
log_level: info

forwards:
  - name: dash               # same name in the UE's config
    listen: 127.0.0.1:8080   # only this host's browser
    peer: falcon-ue-01
