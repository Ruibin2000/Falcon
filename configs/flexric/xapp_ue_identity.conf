# Independent experimental collector. No Plan 2 broker or application protocol.
# Start after CU and both DUs finish E2 Setup. Only present nodes are discovered.
# The CU candidate adds FALCON.UE.RRCState (0 idle, 1 connected, 2 inactive).
# Format 4 condition: S-NSSAI SST=1. CU implements this filter from admitted DRBs;
# the existing DU implementation's slice-filter limitations remain unchanged.
SM_DIR = "/tmp/falcon-ue-identity-sm/"
Name = "xApp"
NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422
Sub_ORAN_SM_List = (
  { name = "KPM", time = 1000, format = 4, ran_type = "ngran_gNB_DU",
    actions = (
      { name = "DRB.RlcSduDelayDl" }, { name = "DRB.UEThpDl" },
      { name = "DRB.UEThpUl" }, { name = "RRU.PrbTotDl" }, { name = "RRU.PrbTotUl" },
      { name = "PUSCH.RSRP.dBFS" }, { name = "PUSCH.SNR.dB" }
    ) },
  { name = "KPM", time = 1000, format = 4, ran_type = "ngran_gNB",
    actions = ( { name = "FALCON.UE.RRCState" } ) },
  { name = "KPM", time = 1000, format = 4, ran_type = "ngran_gNB_CU",
    actions = ( { name = "FALCON.UE.RRCState" } ) },
  { name = "KPM", time = 1000, format = 4, ran_type = "ngran_gNB_CUCP",
    actions = ( { name = "FALCON.UE.RRCState" } ) }
)
xApp_DB = {
  enable = "OFF"
  ip = "127.0.0.1"
  dir = "/tmp/"
  filename = "ue_identity"
  username = "xapp"
  password = ""
}
