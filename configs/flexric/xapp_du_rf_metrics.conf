# Requires the existing timestamp repair, already committed at FlexRIC 10b8ec79.
# Preserve that repair; do not re-apply 73650812-kpm-timestamp.patch.
# Use 73650812-du-rf-metrics.patch INSTEAD OF 73650812-pusch-rsrp.patch.
# The new cumulative patch already includes the earlier RSRP monitor changes.
# The DU must expose both vendor RF metrics before this subscription is used.
# RSRP is uplink PUSCH DM-RS power in software dBFS, not downlink RSRP/dBm.
# SNR keeps the original scheduler label and its existing ul_sinr_dB source, in dB.
# The RSRQ = n/a notice is local xApp capability status, not an E2 measurement.
# No RSRQ or separately named SINR metric is subscribed.
# Run the patched xapp_oran_moni with -c and this configuration path.
# DUs present at startup receive one subscription each; relaunch after adding a DU.
# The Format 4 condition remains S-NSSAI/SST = 1. In current OCUDU, the
# provider's matching-condition function does not enforce a slice filter.
# Use Ctrl+C or SIGTERM for normal subscription deletion and shutdown.
# header_time_us is the KPM header time, not the PHY sample timestamp;
# sample_idx is the row index within the received report.
# Set FALCON_KPM_RF_TRACE=1 for full-precision decoded RF rows (off by default).
# This trace does not establish PHY sample age or DU source-window correlation.

SM_DIR = "/usr/local/lib/flexric/"
Name = "xApp"
NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 4,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.RlcSduDelayDl" },
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" },
            { name = "RRU.PrbTotDl" },
            { name = "RRU.PrbTotUl" },
            { name = "FALCON.PUSCH.RSRP.dBFS" },
            { name = "FALCON.PUSCH.SNR.dB" }
            )
    }
)

# Current build uses NONE_XAPP. This example exports terminal text only.
xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "falcon_du_rf_metrics"
    username = "xapp"
    password = ""
}
