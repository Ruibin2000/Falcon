# Compatibility profile: exactly five DU measurements at 1000 ms.
# Preserve raw units and the committed KPM timestamp repair.
SM_DIR = "/usr/local/lib/flexric/"
Name = "xApp"
NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422
Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000, format = 4, ran_type = "ngran_gNB_DU",
      actions = (
        { name = "DRB.RlcSduDelayDl" },
        { name = "DRB.UEThpDl" },
        { name = "DRB.UEThpUl" },
        { name = "RRU.PrbTotDl" },
        { name = "RRU.PrbTotUl" }
      )
    }
)
xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "falcon_kpm_base5"
    username = "xapp"
    password = ""
}
