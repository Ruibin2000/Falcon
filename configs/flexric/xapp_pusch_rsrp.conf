# FlexRIC 73650812 with 73650812-kpm-timestamp.patch applied first,
# followed by 73650812-pusch-rsrp.patch. The DU must expose this metric.
# FALCON.PUSCH.RSRP.dBFS is a project-specific uplink PUSCH measurement;
# it is neither UE downlink RSRP nor calibrated received power in dBm.
# Run the patched xapp_oran_moni with -c and this configuration path.
# Each node present at startup is subscribed when its type is ngran_gNB_DU.
# The example's Format 4 matching condition remains S-NSSAI/SST = 1.
# Use Ctrl+C or SIGTERM for normal subscription deletion and shutdown.
# header_time_us is the KPM header time, not the PHY sample timestamp;
# sample_idx is the row index within the received report.

SM_DIR = "/usr/local/lib/flexric/"
Name = "xApp"
NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 4,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.RlcSduDelayDl" },
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" },
            { name = "RRU.PrbTotDl" },
            { name = "RRU.PrbTotUl" },
            { name = "FALCON.PUSCH.RSRP.dBFS" }
            )
    }
)

# Current build uses NONE_XAPP. This example exports terminal text only.
xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "falcon_pusch_rsrp"
    username = "xapp"
    password = ""
}
