# DU2 / FR3: 9250 MHz OTA via Pi-Radio; logical interface 3600 MHz / n78 / 40 MHz.
# At 30 kHz SCS, nominal channels are 3580-3620 MHz (interface), 9230-9270 MHz (OTA).
# Default SSB ARFCN at this bandwidth is 638976; use the matching UE2 lock.
# B210 328B021 was independently discovered on Spark on 2026-10-13.
# Rediscover both physical radios before live dual-DU startup.
# TX/RX gains are 60/10 dB after tuning the modified 9250-MHz FR3 hardware path.
# Load du2_flexric.yml as the second configuration file.
gnb_id: 411
gnb_id_bit_length: 22
gnb_du_id: 2

f1ap:
  addrs: 127.0.10.1
  bind_addrs: 127.0.10.3

f1u:
  socket:
    - bind_addr: 127.0.10.3

ru_sdr:
  device_driver: uhd
  device_args: type=b200,serial=328B021,num_recv_frames=64,num_send_frames=64
  srate: 46.08
  clock: internal
  clock_ppm: 0.0
  freq_offset: 0
  tx_gain: 60
  rx_gain: 10

cell_cfg:
  dl_arfcn: 640000
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 2
  sector_id: 1

log:
  filename: /tmp/du2_3600.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/du2_3600_mac.pcap
  f1ap_enable: false
  f1ap_filename: /tmp/du2_3600_f1ap.pcap
  f1u_enable: false
  f1u_filename: /tmp/du2_3600_f1u.pcap
