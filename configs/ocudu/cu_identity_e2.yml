# Opt-in only; preserve the existing accepted CU invocation without this overlay.
cu_cp:
  # Allow modem registration/status polling before the laptop requests its PDU.
  request_pdu_session_timeout: 10
e2:
  enable_cu_cp_e2: true
  enable_cu_up_e2: false
  addrs: [127.0.0.1]
  port: 36421
  bind_addrs: [127.0.0.1]
  e2sm_kpm_enabled: true
metrics:
  layers:
    enable_ue_identity: true
  periodicity:
    cu_cp_report_period: 1000
